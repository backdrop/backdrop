<VirtualHost *:80>
  ServerName localhost
  DocumentRoot /home/runner/work/_REPOSITORY_NAME_

  <Directory /home/runner/work/_REPOSITORY_NAME_>
    AllowOverride All
    Require all granted
    Options FollowSymLinks
  </Directory>

  # Placeholder _PHP_VERSION_  will be substituted in step "Setup webserver".
  <FilesMatch ".+\.php$">
    SetHandler "proxy:unix:/run/php/php_PHP_VERSION_-fpm.sock|fcgi://localhost"
  </FilesMatch>
</VirtualHost>
