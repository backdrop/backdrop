<VirtualHost *:80>
  ServerName localhost
  DocumentRoot _DOCROOT_

  <Directory _DOCROOT_>
    AllowOverride All
    Require all granted
    Options FollowSymLinks
  </Directory>

  # Placeholders _DOCROOT_ and _PHP_VERSION_ will be substituted in step
  # "Finish webserver setup".
  <FilesMatch ".+\.php$">
    SetHandler "proxy:unix:/run/php/php_PHP_VERSION_-fpm.sock|fcgi://localhost"
  </FilesMatch>
</VirtualHost>
